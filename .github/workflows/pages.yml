name: Pages (SeedSigner demo QRs)

# Builds the static demo site and publishes it with the official GitHub Pages
# action.
#
# Security posture (mirrors seedsigner-lvgl-screens/.github/workflows/pages.yml):
#   - Top-level token is read-only. Only the deploy job opts into the minimal
#     Pages-publish scopes (pages: write + id-token). NOTHING uses
#     contents: write and nothing pushes to a branch, so a compromised build
#     step or third-party action cannot tamper with the repo.
#   - Deploys happen ONLY on push to main / manual dispatch. pull_request runs
#     build + verify with a read-only token, so there is no fork-vs-non-fork
#     distinction to guard.
#   - All actions are pinned to commit SHAs.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". Optionally restrict the `github-pages` environment to the
# `main` branch (Settings -> Environments) for platform-level enforcement.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build + verify on every event, including fork PRs. Read-only.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # zbar is only needed by the verification step; pyzbar wraps the system lib.
      - name: Install zbar
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Rebuild fixtures and confirm they are reproducible
        run: |
          python -m tools.build_fixtures
          git diff --exit-code -- fixtures/ \
            || { echo "::error::fixtures/ is not reproducible from tools/build_fixtures.py"; exit 1; }

      # The site cannot be built without this: every animated transaction QR is
      # generated in the browser by this module, and tools/build_site.py refuses
      # to produce a site if it is missing. Docker + a pinned emsdk image, so no
      # toolchain action to trust and no version drift.
      - name: Build the WASM module (UR codec + QR encoder + QR decoder)
        run: bash tools/wasm/build.sh

      - name: Build the site
        run: python -m tools.build_site

      # Decodes the QR matrices with an independent decoder (zbar), reassembles
      # the PSBTs, cross-checks them, and verifies the shipped sighash digests
      # against real signatures. A broken artifact fails the build rather than
      # shipping to a demo table.
      - name: Verify built artifacts
        run: python -m tools.verify

      # The browser is now the encoder for animated QRs, so it needs its own
      # gate: encode -> rasterize -> decode -> reassemble, cross-checked against
      # the Python reference, plus the signature verifier's positive AND
      # negative cases. Node is preinstalled on the runner image.
      - name: Check the browser pipeline against the Python reference
        run: |
          python -m tools.wasm.reference
          node tools/wasm/roundtrip_test.mjs

      # Renders the real page in a real browser. The scan-the-signature-back
      # step has no other coverage — it is the only place getUserMedia, k_quirc,
      # the fountain decoder and secp256k1 all run together.
      - name: Browser smoke test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m tools.serve 8777 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8777/ && break
            sleep 1
          done
          node tools/smoke_site.mjs http://localhost:8777/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site/dist

  deploy:
    # Only this job holds write scopes, and only on trusted, post-merge events.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
